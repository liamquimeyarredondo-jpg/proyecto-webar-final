<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <title>WebAR · Villa Hortensia y el fantasma</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <main id="ar-app">
    <a-scene
      id="ar-scene"
      mindar-image="imageTargetSrc: ./targets/poster.mind; autoStart: false; maxTrack: 1; uiLoading: no; uiScanning: no; uiError: no"
      embedded
      color-space="sRGB"
      renderer="alpha: true; antialias: true; colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">
      <a-camera id="ar-camera" position="0 0 0" look-controls="enabled: false"
        cursor="fuse: false; rayOrigin: mouse"
        raycaster="objects: .tap-target; near: 0; far: 10000"></a-camera>

      <!-- Índice 0: afiche 1, Villa Hortensia. -->
      <a-entity id="poster-target-0" mindar-image-target="targetIndex: 0">
        <a-plane id="tap-target-0" class="tap-target" position="0 0 0.025" width="1" height="1.414"
          material="shader: flat; color: #000000; transparent: true; opacity: 0.001; side: double; depthWrite: false"></a-plane>
        <a-entity id="art-node-0" visible="false"></a-entity>
        <a-entity id="text-node-0" visible="false"></a-entity>
      </a-entity>

      <!-- Índice 1: afiche 2, video del fantasma. -->
      <a-entity id="poster-target-1" mindar-image-target="targetIndex: 1">
        <a-plane id="tap-target-1" class="tap-target" position="0 0 0.025" width="1" height="1.414"
          material="shader: flat; color: #000000; transparent: true; opacity: 0.001; side: double; depthWrite: false"></a-plane>
        <a-entity id="video-node-1" visible="false"></a-entity>
      </a-entity>
    </a-scene>

    <div id="camera-hint" class="camera-hint" aria-live="polite">Preparando la cámara…</div>

    <!-- Pantalla final de Villa Hortensia (escena 6). -->
    <section id="web-cta-panel" class="web-cta-panel" hidden aria-live="polite">
      <p id="web-cta-heading">Visita la página web para conocer más sobre el barrio y sus historias</p>
      <a id="web-cta-button" class="web-cta-button" href="#" target="_blank" rel="noopener noreferrer">Haz clic para ir a la página</a>
      <button id="web-cta-restart" class="web-cta-restart" type="button">Volver al inicio</button>
    </section>

    <div id="setup-notice" class="setup-notice" role="status" hidden></div>
    <div class="rotate-notice" aria-hidden="true">Para una mejor experiencia, girá el celular a vertical.</div>
  </main>
  <script src="app.js"></script>
</body>
</html>
